title: ARTEX Control-Plane Routes, BLOODALCHEMY C2 URI (/Inform/logger/), or Self-Update User-Agent
id: 6d3b2c4e-9a41-4c9e-8b4d-1e7f90c1a018
status: experimental
description: >
  Detects ARTEX control-plane HTTP API/UI routes (/api/exploration/, /api/intercept/,
  /api/sync/scopesentry, /function/tasks), BLOODALCHEMY C2 URI (/Inform/logger/),
  and the artex-selfupdate User-Agent grounded in Theori AIPT and artex-global research.
references:
  - https://github.com/theori-io/aipt-detections
  - https://github.com/jiwoochris/artex-global/blob/main/docs/defense-en.md
author: ARTEX Defensive Research Workbench
date: 2026-11-20
modified: 2026-11-25
tags:
  - attack.command_and_control
  - attack.collection
  - attack.t1071.001
logsource:
  category: webserver
detection:
  selection_console_routes:
    c-uri|contains:
      - '/api/exploration/'
      - '/api/intercept/'
      - '/api/sync/scopesentry'
      - '/api/llm/profiles'
      - '/api/llm/records'
      - '/function/tasks/'
      - '/function/tasks\?'
      - '/function/findings/'
      - '/function/findings\?'
      - '/function/traffic/'
      - '/function/traffic\?'
      - '/function/llm-records/'
      - '/function/llm-records\?'
      - '/function/workspace/'
      - '/function/workspace\?'
      - '/Inform/logger/'
  selection_console_routes_exact:
    c-uri|endswith:
      - '/function/tasks'
      - '/function/findings'
      - '/function/traffic'
      - '/function/llm-records'
      - '/function/workspace'
  selection_selfupdate_ua:
    cs-user-agent|contains:
      - 'artex-selfupdate'
  condition: selection_console_routes or selection_console_routes_exact or selection_selfupdate_ua
falsepositives:
  - Authorized red-team infrastructure validation.
level: high
