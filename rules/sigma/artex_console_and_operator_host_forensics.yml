title: ARTEX Control-Plane Routes, Recording Proxy (8788 / mitmproxy CA), or Task Cmd-Output Spill
id: 6d3b2c4e-9a41-4c9e-8b4d-1e7f90c1a018
status: experimental
description: >
  Detects ARTEX operator-host and control-plane forensic artifacts grounded in Theori AIPT
  and artex-global defense guides: console API/UI routes (/api/exploration/, /api/intercept/,
  /api/sync/scopesentry, /function/tasks), artex-selfupdate User-Agent, recording proxy
  port 8788 / mitmproxy-ca-cert.pem, and worker spill paths (/tasks/<id>/i<id>/cmd-output/).
references:
  - https://github.com/theori-io/aipt-detections
  - https://github.com/jiwoochris/artex-global/blob/main/docs/defense-en.md
author: ARTEX Defensive Research Workbench
date: 2026-11-20
tags:
  - attack.command_and_control
  - attack.collection
  - attack.t1071.001
  - attack.t1074.001
logsource:
  category: webserver
detection:
  selection_console_routes:
    c-uri|contains:
      - '/api/exploration/'
      - '/api/intercept/'
      - '/api/sync/scopesentry'
      - '/api/llm/profiles'
      - '/api/llm/records'
      - '/function/tasks'
      - '/function/findings'
  selection_host_artifacts:
    CommandLine|contains:
      - '/cmd-output/'
      - 'mitmproxy-ca-cert.pem'
      - 'traffic/_index/index.sqlite'
      - 'artex_token='
  selection_selfupdate_ua:
    cs-user-agent|contains:
      - 'artex-selfupdate'
  condition: 1 of selection*
falsepositives:
  - Authorized red-team infrastructure or local mitmproxy developer debugging.
level: high
