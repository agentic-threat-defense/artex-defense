title: Autonomous Agentic AD Pivot Toolkit (Chisel/Proxychains, NTLM Relay, Relocated DLL Sideloading, Staging C Compiler)
id: 3f7a9d12-8b54-4e61-a29f-6c4d81e5b204
status: experimental
description: >
  Detects generalized post-exploitation tradecraft used by autonomous offensive agents during
  internal Active Directory pivoting: Chisel/Ligolo/Proxychains SOCKS tunnel meshes, NTLM relay
  and anonymous LDAP/SAMR enumeration, relocated browser binary DLL sideloading with adjacent
  config.bin outside Program Files, and on-box C compilation inside /tmp or /dev/shm on servers.
references:
  - https://www.ic3.gov
  - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
author: ARTEX Defensive Research Workbench
date: 2026-11-21
tags:
  - attack.command_and_control
  - attack.credential_access
  - attack.defense_evasion
  - attack.t1090.001
  - attack.t1574.002
  - attack.t1557.001
  - attack.t1027.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_pivot_tunnel:
    CommandLine|contains:
      - 'chisel client'
      - 'chisel.exe client'
      - 'R:socks'
      - 'proxychains -f'
      - 'proxychains4 -f'
      - 'ligolo-agent'
  selection_ntlm_relay:
    CommandLine|contains:
      - 'ntlmrelayx'
      - 'smbserver.py'
      - 'petitpotam'
      - 'coercer'
      - 'certipy'
      - 'ldapdomaindump'
  selection_relocated_sideload:
    Image|endswith:
      - '\edge.exe'
      - '\msedge.exe'
    CommandLine|contains:
      - 'config.bin'
  filter_legit_program_files:
    Image|contains:
      - '\Program Files\'
      - '\Program Files (x86)\'
      - '\Windows\System32\'
  condition: selection_pivot_tunnel or selection_ntlm_relay or (selection_relocated_sideload and not filter_legit_program_files)
falsepositives:
  - Authorized internal red-team or purple-team exercises using Chisel or Impacket.
level: high
