title: AWS CloudTrail Agentic EC2 userData Harvesting, SSM Decryption/SendCommand, or External EC2 Role Replay
id: 7c2e41b8-5a93-4d7c-9e12-4b8f71a6c309
status: experimental
description: >
  Detects AWS CloudTrail tradecraft documented in Elastic Security Labs' CyberStrikeAI intrusion
  ("56 AWS API calls in 141ms"): bulk EC2 DescribeInstanceAttribute (userData) extraction,
  SSM Parameter Store decryption (GetParametersByPath / GetParameter WithDecryption) and
  SSM SendCommand remote execution, or compromised EC2 instance-role replay (assumed-role/.../i-*).
references:
  - https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
  - https://www.ic3.gov
author: ARTEX Defensive Research Workbench
date: 2026-11-21
tags:
  - attack.discovery
  - attack.credential_access
  - attack.execution
  - attack.t1552.005
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_ec2_userdata:
    eventName: 'DescribeInstanceAttribute'
    requestParameters.attribute: 'userData'
  selection_ssm_decrypt:
    eventName:
      - 'GetParametersByPath'
      - 'GetParameter'
      - 'GetParameters'
    requestParameters.withDecryption: true
  selection_ssm_exec:
    eventName: 'SendCommand'
    requestParameters.documentName:
      - 'AWS-RunShellScript'
      - 'AWS-RunPowerShellScript'
  selection_ec2_role_sensitive:
    # Scope specifically to EC2 instance-profile sessions (assumed-role/<Role>/i-<instance-id>)
    userIdentity.arn|contains|all:
      - 'assumed-role/'
      - '/i-'
    eventName:
      - 'DescribeInstanceAttribute'
      - 'GetSecretValue'
      - 'GetParametersByPath'
      - 'SendCommand'
  condition: selection_ec2_userdata or selection_ssm_decrypt or selection_ssm_exec or selection_ec2_role_sensitive
falsepositives:
  - Approved cloud-inventory or configuration-management automation (allowlist by IaC/automation IP or role ARN).
level: high
