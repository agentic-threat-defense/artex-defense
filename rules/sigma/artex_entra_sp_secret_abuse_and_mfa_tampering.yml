title: Microsoft Entra ID Service Principal Secret Guessing (7000215) or MFA Denial / Security Info Tampering
id: 6d3b2c4e-9a41-4c9e-8b4d-1e7f90c1a022
status: experimental
description: >
  Detects Entra ID non-interactive Service Principal invalid client-secret probing (error codes
  7000215 / 7000222), MFA push/OTP denial bursts (500121), or suspicious security-info / OAuth
  credential tampering associated with Storm-0940 and ARTEX cloud pivoting.
references:
  - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
  - https://www.microsoft.com/en-us/security/blog/
author: ARTEX Defensive Research Workbench
date: 2026-11-21
tags:
  - attack.credential_access
  - attack.persistence
  - attack.t1110.003
  - attack.t1621
  - attack.t1098.001
logsource:
  product: azure
  service: signinlogs
detection:
  selection_sp_secret_or_mfa:
    Action|contains:
      - 'err_7000215'
      - 'err_7000222'
      - 'err_500121'
      - 'Register security info'
      - 'AddServicePrincipalCredentials'
      - 'ConsentToApplication'
  condition: selection_sp_secret_or_mfa
falsepositives:
  - Recently expired service principal secrets on legacy automation jobs (check for rapid subsequent success or new ASN).
level: high
