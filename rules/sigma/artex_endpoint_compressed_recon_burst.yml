title: Web or Appliance Process Spawning Shell or Compressed Cloud/AD Recon Commands
id: 6d3b2c4e-9a41-4c9e-8b4d-1e7f90c1a014
status: experimental
description: >
  Detects web servers or appliance daemons spawning command shells, or rapid endpoint
  execution of cloud identity / domain trust enumeration commands characteristic of
  post-compromise ARTEX worker agents.
references:
  - https://www.crowdstrike.com
author: ARTEX Defensive Research Workbench
date: 2026-11-20
tags:
  - attack.execution
  - attack.discovery
  - attack.t1059
  - attack.t1580
logsource:
  category: process_creation
  product: windows
detection:
  selection_web_parent:
    ParentImage|contains:
      - 'w3wp.exe'
      - 'nginx'
      - 'httpd'
      - 'php-fpm'
      - 'restjavad'
  selection_shell_child:
    Image|contains:
      - 'cmd.exe'
      - 'powershell.exe'
      - 'pwsh'
      - '/bin/sh'
      - '/bin/bash'
  selection_cloud_ad_recon:
    CommandLine|contains:
      - 'nltest /domain_trusts'
      - 'aws sts get-caller-identity'
      - 'az account show'
  condition: (selection_web_parent and selection_shell_child) or selection_cloud_ad_recon
falsepositives:
  - Authorized DevOps automation runners executing cloud CLI diagnostics.
level: high
