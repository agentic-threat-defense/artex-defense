title: Autonomous Agentic Linux Staging C Compilation, Proxychains/AD Pivot, or ARTEX Host Artifacts
id: 9f4e2a17-6b3c-4d8e-9a51-2c7b80e4d312
status: experimental
description: >
  Detects Linux post-exploitation staging, pivoting, and ARTEX operator-host behaviors:
  on-box C/C++ compilation (gcc, g++, clang, cc) targeting volatile staging directories
  (/tmp, /dev/shm, /var/tmp) outside package managers, proxychains/chisel/Impacket/NetExec
  pivoting, and ARTEX task/mitmproxy/Docker host artifacts.
references:
  - https://www.ic3.gov
  - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
  - https://github.com/theori-io/aipt-detections
author: ARTEX Defensive Research Workbench
date: 2026-11-22
tags:
  - attack.defense_evasion
  - attack.command_and_control
  - attack.lateral_movement
  - attack.t1027.004
  - attack.t1090.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_compiler:
    Image|endswith:
      - 'gcc'
      - 'g++'
      - 'clang'
      - 'clang++'
      - '/cc'
  selection_staging_path:
    CommandLine|contains:
      - '/tmp/'
      - '/dev/shm/'
      - '/var/tmp/'
  filter_legit_builds:
    ParentImage|endswith:
      - '/dpkg'
      - '/apt'
      - '/yum'
      - '/dnf'
      - '/rpm'
      - '/pip'
      - '/pip3'
      - '/cargo'
      - '/go'
      - '/dkms'
      - '/cmake'
  selection_proxychains:
    CommandLine|contains:
      - 'proxychains'
      - 'proxychains4'
  selection_chisel_linux:
    CommandLine|contains|all:
      - 'chisel'
      - 'client'
  selection_linux_pivot_tools:
    CommandLine|contains:
      - 'ligolo-agent'
      - 'ntlmrelayx'
      - 'smbserver.py'
      - 'secretsdump'
      - 'petitpotam'
      - 'coercer'
      - 'certipy'
      - 'ldapdomaindump'
      - 'evil-winrm'
      - 'netexec'
      - '/Responder/Responder.py'
  selection_ruby_web_shell:
    ParentImage|endswith:
      - '/puma'
      - '/unicorn'
      - '/unicorn_rails'
      - '/passenger'
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/zsh'
  selection_temp_cloudflared:
    Image|contains:
      - '/tmp/'
      - '/dev/shm/'
      - '/var/tmp/'
    Image|endswith:
      - 'cloudflared'
    CommandLine|contains:
      - 'tunnel'
  selection_artex_linux_host:
    CommandLine|contains:
      - 'mitmproxy-ca-cert.pem'
      - 'traffic/_index/index.sqlite'
      - '/cmd-output/'
      - 'tomicdd/artex'
      - 'congdonglinux/artex'
  selection_ssh_reverse_tunnel:
    Image|endswith:
      - '/ssh'
    CommandLine|contains:
      - ' -R '
      - ' -NR '
      - ' -fNR '
      - ' -NTR '
      - 'RemoteForward'
    CommandLine|contains|all:
      - ':'
  condition: (selection_compiler and selection_staging_path and not filter_legit_builds) or selection_proxychains or selection_chisel_linux or selection_linux_pivot_tools or selection_ruby_web_shell or selection_temp_cloudflared or selection_artex_linux_host or selection_ssh_reverse_tunnel
falsepositives:
  - Dedicated CI/CD build servers compiling temporary probes in /tmp (exclude known CI/build hosts).
  - Authorized red-team jump hosts running Proxychains, Chisel, or Impacket.
level: high
