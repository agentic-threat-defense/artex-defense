title: Potential ARTEX Rapid VPN Authentication Spray or WebVPN Probing on Cisco ASA / FTD
id: 6d3b2c4e-9a41-4c9e-8b4d-1e7f90c1a010
status: experimental
description: >
  Detects rapid, low-dwell authentication failures or WebVPN/CSCOE URI probing against
  Cisco ASA and Firepower Threat Defense (FTD) appliances consistent with autonomous
  agentic offensive frameworks (e.g., ARTEX).
references:
  - https://www.ic3.gov
  - https://blog.talosintelligence.com
author: ARTEX Defensive Research Workbench
date: 2026-11-20
tags:
  - attack.initial_access
  - attack.credential_access
  - attack.t1110.003
  - attack.t1190
logsource:
  category: firewall
  product: cisco_asa
detection:
  selection_asa_auth_fail:
    Action|contains:
      - 'asa_113005_auth_failed'
      - 'ftd_113005_auth_failed'
      - 'asa_113015_auth_failed'
  selection_webvpn_uri:
    c-uri|contains:
      - '/+CSCOE+/'
      - '/+webvpn+/'
  condition: selection_asa_auth_fail and selection_webvpn_uri
falsepositives:
  - Misconfigured VPN client profiles repeatedly retrying expired credentials.
level: high
