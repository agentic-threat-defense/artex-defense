title: Duo Security, PingFederate, and Google Workspace 2FA Fatigue & Factor Tampering
id: 9b4e1a27-3c8f-4f92-b7c1-8d2e60f4a139
status: experimental
description: >
  Detects 2FA push bombing, explicit fraud reports, bypass-code/device enrollment tampering,
  and 2-Step Verification (2SV) disabling across Duo Security, PingFederate/PingID,
  and Google Workspace Reports API audit logs.
references:
  - https://www.ic3.gov
  - https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting
author: ARTEX Defensive Research Workbench
date: 2026-11-21
tags:
  - attack.credential_access
  - attack.persistence
  - attack.t1621
  - attack.t1098.005
logsource:
  category: authentication
  product: idp
detection:
  selection_duo:
    Action|contains:
      - 'duo_fraud_reported'
      - 'fraud_reported'
      - 'user_marked_fraud'
      - 'duo_admin:bypass_create'
      - 'duo_admin:phone_create'
      - 'duo_admin:2fa_device_enroll'
  selection_ping:
    Action|contains:
      - 'pingid_device_paired'
      - 'mfa_device_enrolled'
      - 'mfa_rejected'
  selection_gws:
    Action|contains:
      - '2sv_disable'
      - '2sv_enroll'
      - 'recovery_phone_edit'
      - 'recovery_email_edit'
      - 'second_factor_failure'
  condition: selection_duo or selection_ping or selection_gws
falsepositives:
  - Planned user device migrations or helpdesk-assisted Duo bypass creation (correlate with ticket/IT admin IP).
level: high
