title: ARTEX Agentic Canary Probes (zzq / nonexistent), Self-Describing UAs, or OAuth Redirect Abuse
id: 6d3b2c4e-9a41-4c9e-8b4d-1e7f90c1a017
status: experimental
description: >
  Detects Unit 42 and Eye Security ARTEX control-404/nonexistent-user canary probes
  (zz_no_such_user, zzq.nonexistent, precheck.not-a-user, zzzrandom, zz-no-such-key),
  write/persistence verification markers (ARTEX_WRITE_PROBE, ARTEX_PERSIST_OK),
  OAuth illegal_redirect_uri_enhanced probing, and self-describing ARTEX User-Agents.
references:
  - https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-10-30-activity-using-ARTEX-agentic-AI.txt
  - https://x.com/BushidoToken/status/2123820659646054782
author: ARTEX Defensive Research Workbench
date: 2026-11-20
tags:
  - attack.reconnaissance
  - attack.initial_access
  - attack.t1595.002
  - attack.t1190
logsource:
  category: webserver
detection:
  selection_canary_uri:
    c-uri|contains:
      - 'zz_no_such_user'
      - 'zzq.nonexistent'
      - 'precheck.not-a-user'
      - 'zzzrandom'
      - 'zz-no-such-key'
      - 'zz-notexist-'
      - 'ARTEX_WRITE_PROBE'
      - 'ARTEX_PERSIST_OK'
      - 'artex_control_marker'
      - '?artex='
      - '&artex='
      - 'eyJhbGciOiJub25lIn0'
      - 'illegal_redirect_uri_enhanced'
  selection_ua:
    cs-user-agent|contains:
      - 'security-testing; authorized'
      - 'LLMLeak-RedTeam/'
      - 'authorised-scan'
      - 'authorized-security-research/'
      - 'vulnerability-disclosure-policy-review'
      - 'authorized-exposure-audit/'
      - 'recon-audit'
      - 'Fuzz Faster U Fool'
      - 'ArtExVerify/1.0'
      - 'Mozilla/5.0 (ARTEX)'
  condition: selection_canary_uri or selection_ua
falsepositives:
  - Authorized red-team exercises explicitly using recon-audit or security-testing user agents.
level: high
