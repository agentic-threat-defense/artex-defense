[project]
name = "artex-defense"
version = "0.2.7"
description = "Local-first defensive threat-hunting and detection-engineering workbench for ARTEX and autonomous agentic offensive frameworks."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2.0",
    "httpx>=0.28.0",
    "mcp>=1.6.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
sigma = [
    "pysigma>=1.0.0",
    "sigma-cli>=2.0.0",
    "pysigma-backend-elasticsearch>=2.0.0",
    "pysigma-backend-kusto>=1.0.0",
    "pysigma-backend-crowdstrike>=2.0.0",
    "pysigma-backend-splunk>=2.0.0",
    "pysigma-backend-sentinelone>=0.1.0",
]

[project.scripts]
artex-hunt = "artex_defense.cli:app"
artex-mcp = "artex_defense.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artex_defense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call a live local Ollama server",
]
